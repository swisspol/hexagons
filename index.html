<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Emitters</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <aside class="panel">
        <header class="panel-header">
            <h1>Hex Emitters</h1>
            <p>Hexagons growing out of two disks</p>
        </header>

        <div class="panel-body">
            <section>
                <h2>Canvas</h2>
                <div class="fields" data-group="canvas"></div>
            </section>
            <section>
                <h2>Emitters</h2>
                <div class="fields" data-group="emitters"></div>
            </section>
            <section>
                <h2>Pattern</h2>
                <div class="fields" data-group="pattern"></div>
            </section>
            <section>
                <h2>Background</h2>
                <div class="fields" data-group="background"></div>
            </section>
            <section>
                <h2>Result</h2>
                <dl class="stats" id="stats"></dl>
                <p class="warning" id="warning" hidden></p>
            </section>
        </div>

        <footer class="panel-footer">
            <button id="downloadBtn" class="primary">Download PNG</button>
            <button id="shareBtn">Copy shareable link</button>
        </footer>
    </aside>

    <main class="stage">
        <canvas id="canvas"></canvas>
    </main>

    <script src="index.js"></script>
</body>
</html>
